<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SİSTEM HATASI</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'VT323', monospace; }
        
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%; z-index: 999999; pointer-events: none;
        }

        #phase1 {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #050505; display: flex; justify-content: center;
            align-items: center; z-index: 9999998; cursor: pointer; color: #777;
            font-size: 24px; text-shadow: 0 0 5px #fff; text-align: center;
        }

        .phase { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
        .active { display: flex !important; flex-direction: column; }

        #phase2 { background-color: #000; padding: 20px; z-index: 888888; }
        .terminal-box { width: 100%; height: 100%; overflow-y: auto; padding-top: 10px; }
        .typewriter { font-size: 22px; line-height: 1.2; color: #ff2a2a; white-space: pre-wrap; word-break: break-all; text-shadow: 2px 0 2px rgba(255,0,0,0.8), -2px 0 2px rgba(0,0,255,0.8); }

        #phase3 { background-color: #000; z-index: 777777; justify-content: center; align-items: center; position: relative; }
        .jumpscare-img { width: 100%; height: 100%; object-fit: cover; filter: contrast(250%) saturate(150%) brightness(80%); mix-blend-mode: hard-light; }

        #scream-box { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; overflow: hidden; }

        #phase4 { background-color: #000; z-index: 666666; justify-content: center; align-items: center; overflow: hidden; }
        #yt-player { width: 100vw; height: 100vh; border: none; transform: scale(1.35); }

        #phase5 { background: #202124; color: #bdc1c6; font-family: sans-serif; padding: 40px 20px; z-index: 555555; align-items: flex-start; justify-content: flex-start; }
        .chrome-error { max-width: 600px; margin: 0 auto; text-align: left; }
        .chrome-error h1 { font-size: 24px; color: #e8eaed; margin-bottom: 15px; font-weight: normal; }
        .chrome-error p { font-size: 15px; line-height: 1.5; margin-bottom: 10px; }
        .chrome-error .error-code { font-size: 12px; color: #80868b; margin-top: 30px; }

        @keyframes heavyGlitch {
            0% { transform: translate(0) scale(1); filter: hue-rotate(0deg); }
            20% { transform: translate(-20px, 15px) scale(1.05); filter: hue-rotate(90deg) invert(1); }
            40% { transform: translate(20px, -15px) scale(1); filter: hue-rotate(180deg); }
            60% { transform: translate(-10px, 20px) scale(1.1); filter: hue-rotate(270deg) invert(1); }
            80% { transform: translate(15px, -10px) scale(1.05); filter: hue-rotate(360deg); }
            100% { transform: translate(0) scale(1); }
        }
        .glitch-active { animation: heavyGlitch 0.1s infinite; }
        @keyframes textBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .blinking { animation: textBlink 1.5s infinite; }
    </style>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

    <div class="crt-overlay"></div>

    <div id="phase1" onclick="startPrank(event)" ontouchstart="startPrank(event)">
        <div class="blinking">[ BAĞLANTIYI KURMAK İÇİN DOKUNUN ]</div>
    </div>

    <div id="phase2" class="phase">
        <div class="terminal-box"><div id="typewriter-text" class="typewriter"></div></div>
    </div>

    <div id="phase3" class="phase">
        <img class="jumpscare-img" src="resim.jpg" alt="Jumpscare">
        <div id="scream-box"><div id="scream-player"></div></div>
    </div>

    <div id="phase4" class="phase">
        <div id="yt-player"></div>
    </div>

    <div id="phase5" class="phase">
        <div class="chrome-error">
            <h1>Aw, Snap!</h1>
            <p>Something went wrong while displaying this webpage.</p>
            <p>Memory integrity compromised. Forced shutdown initiated to prevent hardware damage.</p>
            <div class="error-code">ERR_CRASHED_BY_SYSTEM</div>
        </div>
    </div>

    <script>
        let started = false;
        let audioCtx;
        let ytPlayer;
        let screamPlayer;

        function onYouTubeIframeAPIReady() {
            screamPlayer = new YT.Player('scream-player', {
                videoId: 'c_mpavBpZlA',
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0, 'playsinline': 1 }
            });

            ytPlayer = new YT.Player('yt-player', {
                videoId: 'mXTYvRf3qew',
                playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'fs': 0, 'modestbranding': 1, 'rel': 0, 'playsinline': 1, 'iv_load_policy': 3 }
            });
        }

        async function startPrank(e) {
            if (e) e.preventDefault();
            if (started) return;
            started = true;

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(err){}

            try {
                if(screamPlayer && screamPlayer.playVideo) { screamPlayer.playVideo(); screamPlayer.pauseVideo(); }
                if(ytPlayer && ytPlayer.playVideo) { ytPlayer.playVideo(); ytPlayer.pauseVideo(); }
            } catch(err){}

            playDizzzt();
            document.body.classList.add('glitch-active');
            try { if (navigator.vibrate) navigator.vibrate([200, 50, 200]); } catch(err){}

            setTimeout(() => {
                document.body.classList.remove('glitch-active');
                document.getElementById('phase1').style.display = 'none';
                document.getElementById('phase2').classList.add('active');
                runTerminal();
            }, 600);
        }

        function playDizzzt() {
            try {
                if(!audioCtx) return;
                let bufferSize = audioCtx.sampleRate * 0.5;
                let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                let data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                let noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                let gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                noise.connect(gain); gain.connect(audioCtx.destination); noise.start();
            } catch(e){}
        }

        function playClack() {
            try {
                if(!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.03);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.03);
            } catch(e){}
        }

        async function runTerminal() {
            let ip = "BİLİNMİYOR";
            try { let res = await fetch('https://api.ipify.org?format=json'); let data = await res.json(); ip = data.ip; } catch(e){}

            let bat = "BİLİNMİYOR";
            try { if(navigator.getBattery) { let battery = await navigator.getBattery(); bat = "%" + Math.round(battery.level * 100); } } catch(e){}

            let cores = navigator.hardwareConcurrency ? navigator.hardwareConcurrency + " ÇEKİRDEK" : "BİLİNMİYOR";
            let ram = navigator.deviceMemory ? navigator.deviceMemory + "GB RAM" : "BİLİNMİYOR";
            let screenRes = screen.width + "x" + screen.height;
            let device = navigator.userAgent.includes("Android") ? "ANDROID CİHAZ" : (navigator.userAgent.includes("iPhone") ? "IPHONE" : "CİHAZ");

            let text = `[LOCAL58 KÖK ERİŞİMİ SAĞLANDI]\n\nHEDEF SİSTEM BİLGİLERİ:\n> IP ADRESİ: ${ip}\n> CİHAZ: ${device}\n> İŞLEMCİ: ${cores}\n> BELLEK: ${ram}\n> EKRAN: ${screenRes}\n> BATARYA SEVİYESİ: ${bat}\n\n>> UYARI: BU BİR TEST DEĞİLDİR.\n>> KAMERA VE MİKROFON ERİŞİMİ: AKTİF.\n>> YÜZ TANIMA VERİLERİ DARK WEB'E AKTARILIYOR...\n>> TÜM GALERİ 256-BİT ŞİFRELENDİ.\n>> CİHAZ ANAKARTI AŞIRI ISINMAYA ZORLANIYOR.\n\nFİDYE TALEBİ OLUŞTURULDU.\nCİHAZINIZ ARTIK BİZE AİT.\n\nARKANA BAKMA.\nARKANA BAKMA.\nARKANA BAKMA...\n`;
            
            let el = document.getElementById('typewriter-text');
            let i = 0;

            let interval = setInterval(() => {
                el.innerText += text[i];
                if(text[i] !== " " && text[i] !== "\n") playClack();
                i++;
                if (i >= text.length) {
                    clearInterval(interval);
                    setTimeout(triggerJumpscare, 1200);
                }
            }, 55);
        }

        function triggerJumpscare() {
            document.getElementById('phase2').classList.remove('active');
            document.getElementById('phase3').classList.add('active');
            document.body.classList.add('glitch-active');
            
            try { 
                if(screamPlayer && screamPlayer.playVideo) {
                    screamPlayer.seekTo(0);
                    screamPlayer.playVideo();
                }
            } catch(e){}
            
            try { if (navigator.vibrate) navigator.vibrate([800, 100, 800, 100, 800]); } catch(e){}

            setTimeout(triggerVideoPhase, 2500);
        }

        function triggerVideoPhase() {
            try { if(screamPlayer && screamPlayer.pauseVideo) screamPlayer.pauseVideo(); } catch(e){}

            document.body.classList.remove('glitch-active');
            document.getElementById('phase3').classList.remove('active');
            document.getElementById('phase4').classList.add('active');

            // Videoyu kesin başlatmak için hem unMute hem playVideo tetikliyoruz
            try { 
                if(ytPlayer) {
                    ytPlayer.unMute();
                    ytPlayer.seekTo(0);
                    ytPlayer.playVideo();
                } 
            } catch(err){}

            setTimeout(triggerErrorPhase, 35000);
        }

        function triggerErrorPhase() {
            document.getElementById('phase4').classList.remove('active');
            document.getElementById('phase5').classList.add('active');
            try { if(ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); } catch(e){}
            try { if (navigator.vibrate) navigator.vibrate([50]); } catch(e){}
        }
    </script>
</body>
</html>
