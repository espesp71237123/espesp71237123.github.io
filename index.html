<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sürpriz!</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Share Tech Mono', monospace; }
        
        /* EVRE 1: DOKUNMA YUTMAYAN DEVASA BUTON */
        #phase1 {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: #ffb6c1; display: flex; justify-content: center;
            align-items: center; z-index: 9999999;
        }
        
        .pink-btn {
            width: 80%; height: 120px; font-size: 28px; font-weight: bold;
            color: #fff; background-color: #ff1493; border: 4px solid #fff;
            border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer; display: flex; justify-content: center; align-items: center;
        }

        .phase { display: none; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .active { display: flex !important; }

        /* CRT EFEKTİ */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.08), rgba(0, 255, 0, 0.03), rgba(0, 0, 255, 0.08));
            z-index: 999; background-size: 100% 3px, 6px 100%; pointer-events: none; opacity: 0.9;
        }

        /* EVRE 2: Hacker Terminal */
        #phase2 { background-color: #020000; color: #ff0000; padding: 20px; align-items: flex-start; justify-content: flex-start; text-align: left; z-index: 888888; }
        .terminal-box { width: 100%; height: 100%; border: 1px solid rgba(255,0,0,0.4); padding: 15px; background: rgba(10,0,0,0.9); overflow-y: auto; }
        .typewriter { font-size: 14px; line-height: 1.4; font-weight: bold; color: #ff0000; white-space: pre-wrap; word-break: break-all; text-shadow: 0 0 8px #ff0000; }

        /* EVRE 3: Jumpscare Resim */
        #phase3 { background-color: #000; z-index: 777777; }
        .jumpscare-img { width: 100%; height: 100%; object-fit: cover; filter: contrast(200%); }

        /* EVRE 4: Video Jumpscare */
        #phase4 { background-color: #000; z-index: 666666; }
        #jump-video { width: 100vw; height: 100vh; object-fit: cover; }

        /* EVRE 5: Hata Ekranı */
        #phase5 { background: #fff; color: #333; font-family: sans-serif; text-align: left; padding: 40px 20px; justify-content: flex-start; z-index: 555555; }
        .chrome-error { max-width: 600px; margin: 0 auto; }
        .chrome-error h1 { font-size: 22px; color: #5f6368; margin-bottom: 15px; }
        .chrome-error p { font-size: 14px; color: #5f6368; line-height: 1.5; margin-bottom: 10px; }
        .chrome-error .error-code { font-size: 11px; color: #5f6368; margin-top: 30px; }

        @keyframes hardGlitch {
            0% { clip-path: inset(40% 0 61% 0); transform: skew(0.8deg) translate(-15px, 5px); }
            50% { clip-path: inset(10% 0 80% 0); transform: skew(2deg) translate(-25px, 15px); }
            100% { clip-path: inset(0% 0 0% 0); transform: skew(0deg) translate(0); }
        }
        .hard-glitch-active { animation: hardGlitch 0.03s infinite alternate; }
    </style>
</head>
<body class="scanlines">

    <!-- EVRE 1 -->
    <div id="phase1">
        <div class="pink-btn" id="startBtn" onclick="runPrank()" ontouchstart="runPrank()">DOKUN! ✨</div>
    </div>

    <!-- EVRE 2 -->
    <div id="phase2" class="phase">
        <div class="terminal-box">
            <div id="typewriter-text" class="typewriter"></div>
        </div>
    </div>

    <!-- EVRE 3 -->
    <div id="phase3" class="phase">
        <img class="jumpscare-img" src="The_Boiled_One.jpg" onerror="this.src='The_Boiled_One.JPG'" alt="Jumpscare">
    </div>

    <!-- EVRE 4 -->
    <div id="phase4" class="phase">
        <video id="jump-video" preload="auto" playsinline>
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>

    <!-- EVRE 5 -->
    <div id="phase5" class="phase">
        <div class="chrome-error">
            <h1>Bu siteye erişilemiyor</h1>
            <p><strong>espesp71237123.github.io</strong> yanıt vermeyi reddetti.</p>
            <p>Aşağıdakileri deneyin:</p>
            <ul>
                <li>Bağlantıyı kontrol etme</li>
                <li>Sistem belleğini ve ağ ayarlarını temizleme</li>
            </ul>
            <div class="error-code">ERR_CRASHED_BY_SYSTEM</div>
        </div>
    </div>

    <script>
        let started = false;
        let audioCtx;

        function runPrank() {
            if (started) return;
            started = true;

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e){}

            try { if (navigator.vibrate) navigator.vibrate([300, 100, 500]); } catch(e){}

            document.getElementById('phase1').style.display = 'none';
            document.getElementById('phase2').classList.add('active');

            startTerminal();
        }

        function playKeySound() {
            try {
                if(!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800 + Math.random() * 600, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.03);
            } catch(e){}
        }

        function playScream() {
            try {
                if(!audioCtx) return;
                let now = audioCtx.currentTime;
                let osc1 = audioCtx.createOscillator();
                let osc2 = audioCtx.createOscillator();
                let gain = audioCtx.createGain();

                osc1.type = 'sawtooth';
                osc2.type = 'square';

                osc1.frequency.setValueAtTime(3500, now);
                osc1.frequency.exponentialRampToValueAtTime(100, now + 3.0);

                osc2.frequency.setValueAtTime(3200, now);
                osc2.frequency.exponentialRampToValueAtTime(80, now + 3.0);

                gain.gain.setValueAtTime(1.0, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 3.0);

                osc1.connect(gain);
                osc2.connect(gain);
                gain.connect(audioCtx.destination);

                osc1.start(now);
                osc2.start(now);
                osc1.stop(now + 3.0);
                osc2.stop(now + 3.0);
            } catch(e){}
        }

        async function startTerminal() {
            let ip = "192.168.1.104";
            try {
                let res = await fetch('https://api.ipify.org?format=json');
                let data = await res.json();
                ip = data.ip;
            } catch(e){}

            let userAgent = navigator.userAgent;
            let device = "CİHAZ SIZILDI";
            if (userAgent.includes("Android")) device = "ANDROID (SİSTEM SIZILDI)";
            else if (userAgent.includes("iPhone")) device = "IOS (SİSTEM SIZILDI)";

            let screenRes = `${window.screen.width}x${window.screen.height}`;
            let cores = navigator.hardwareConcurrency || "8";

            let text = `root@kernel:~# INITIALIZING BREACH...\n[!] ACCESS: FULL\n\n> IP: ${ip}\n> CİHAZ: ${device}\n> EKRAN: ${screenRes} px\n> İŞLEMCİ: ${cores} Core\n\n[ERROR] KİŞİSEL VERİLER SIZDIRILIYOR...\nDOSYALAR ŞİFRELENDİ.\n\nSİSTEM KİLİTLENDİ! %100`;
            let el = document.getElementById('typewriter-text');
            let i = 0;

            let interval = setInterval(() => {
                el.innerText += text[i];
                playKeySound();
                i++;
                if (i >= text.length) {
                    clearInterval(interval);
                    setTimeout(triggerImageJumpscare, 600);
                }
            }, 30);
        }

        function triggerImageJumpscare() {
            document.getElementById('phase2').classList.remove('active');
            document.getElementById('phase3').classList.add('active');
            document.body.classList.add('hard-glitch-active');

            playScream();
            try { if (navigator.vibrate) navigator.vibrate([1000, 50, 1000]); } catch(e){}

            // 3 saniye resim durduktan sonra videoya geç
            setTimeout(triggerVideoJumpscare, 3000);
        }

        function triggerVideoJumpscare() {
            document.body.classList.remove('hard-glitch-active');
            document.getElementById('phase3').classList.remove('active');
            document.getElementById('phase4').classList.add('active');

            let vid = document.getElementById('jump-video');
            vid.volume = 1.0;
            
            let playPromise = vid.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    // Video engellenirse doğrudan son evre olan hata ekranına geç
                    showErrorScreen();
                });
            }

            vid.onended = function() {
                showErrorScreen();
            };
            
            // Videoyu 8 saniye oynatıp çökme ekranına ver
            setTimeout(showErrorScreen, 8000);
        }

        function showErrorScreen() {
            document.getElementById('phase4').classList.remove('active');
            document.getElementById('phase5').classList.add('active');
        }
    </script>
</body>
</html>
